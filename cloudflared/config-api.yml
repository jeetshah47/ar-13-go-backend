# Cloudflare Tunnel Configuration for AR-13 API Backend
# Copy this file to cloudflared/config.yml and update with your values

# Your tunnel ID (get from credentials.json or Cloudflare dashboard)
tunnel: 8913c65b-ed0b-485b-9f6d-18c4eef87f5b

# Path to credentials file (inside container)
credentials-file: /etc/cloudflared/credentials.json

# Ingress rules - define how traffic is routed
ingress:
  # API endpoints - route to Docker backend service
  # Use 'server:3000' when running in Docker Compose (same network)
  # Use 'localhost:3000' if using network_mode: host
  - hostname: arback.jsdeveloper.cloud
    service: http://server:3000
  
  # Catch-all rule (must be last)
  - service: http_status:404

