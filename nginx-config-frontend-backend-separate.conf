# Nginx Configuration: Frontend + Backend on Same Domain
# Frontend: Separate server (Next.js, Vite dev server, etc.) on port 3001
# Backend: Go API on port 3000

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # Replace with your domain

    # Increase timeouts for WebSocket
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # WebSocket endpoint - proxy to backend
    location /ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints - proxy to backend
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file uploads - proxy to backend
    location /uploads {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
    }

    # Health check endpoint - proxy to backend
    location /health {
        proxy_pass http://localhost:3000;
        access_log off;
    }

    # Frontend - proxy to frontend server (Next.js, Vite, etc.)
    location / {
        proxy_pass http://localhost:3001;  # Change to your frontend port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for frontend dev server (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

