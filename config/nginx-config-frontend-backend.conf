# Nginx Configuration: Frontend + Backend on Same Domain
# Frontend: Static files (React/Vue/Angular build)
# Backend: Go API on port 3000

server {
    listen 80;
    server_name _;  # Accepts any domain/IP (ngrok will handle the domain)
    # NOTE: Do NOT include https:// in server_name! Just use _ for ngrok

    # Root directory for frontend static files
    root /var/www/frontend;  # Change to your frontend build directory (or /var/www/frontend/dist if files are in dist folder)
    index index.html;

    # Increase timeouts for WebSocket
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # WebSocket endpoint - proxy to backend
    location /ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints - proxy to backend
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file uploads - proxy to backend
    location /uploads {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
    }

    # Health check endpoint - proxy to backend
    location /health {
        proxy_pass http://localhost:3000;
        access_log off;
    }

    # Frontend static files (JS, CSS, images, etc.)
    # This must come before location / to catch asset requests
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Common asset directories - only match actual files in these directories
    # This matches /static/, /assets/, /_next/, etc. but only for files with extensions
    location ~* ^/(static|assets|_next|public|media|images|fonts)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # App assets directory - only match actual asset files in /app/assets/
    location ~* ^/app/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Frontend SPA routing - serve index.html for all routes
    # This handles client-side routing (React Router, Vue Router, etc.)
    # Must be last location block to catch all other requests
    # This will catch /app/dashboard and all other SPA routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

