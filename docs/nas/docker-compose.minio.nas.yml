# version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # MinIO Root Credentials (CHANGE THESE!)
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Optional: Set timezone
      TZ: Asia/Kolkata
    ports:
      # MinIO API (for S3 operations) - SSL enabled
      - "9000:9000"
      # MinIO Console (Web UI) - SSL enabled
      - "9001:9001"
    volumes:
      # Persistent storage - mount "Resumers" folder directly so all files are visible
      # All MinIO buckets and files will be stored directly in "Resumers" folder
      - "D:/Resumers/:/data"
      # MinIO configuration (hidden folder, doesn't affect file visibility)
      - "D:/Resumers/.minio-config:/root/.minio"
      # SSL certificates (hidden folder, doesn't affect file visibility)
      - "D:/Resumers/.minio-certs:/root/.minio/certs"
    networks:
      - minio-network
    # Enable interactive terminal access in Container Station
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

networks:
  minio-network:
    driver: bridge

