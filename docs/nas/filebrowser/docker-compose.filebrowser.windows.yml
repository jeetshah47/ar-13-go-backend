# FileBrowser Docker Compose for Windows Machine
# This configuration mounts D:/Resumers/ folder for browsing client files

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"  # Run as UID 1000 (common for containers)
    ports:
      # FileBrowser Web UI (using non-privileged port 3000 in container)
      - "8081:3000"
    volumes:
      # Mount Windows folder containing client files
      # All files in D:/Resumers/ will be visible in FileBrowser
      - "D:/Resumers/:/srv"
      # FileBrowser configuration (stored locally)
      # The folder will be created automatically, but ensure Docker has write access
      - "./filebrowser-config:/filebrowser-config"
    environment:
      # Database location (using custom config directory)
      - FB_DATABASE=/filebrowser-config/database.db
      # Root directory for FileBrowser
      - FB_ROOT=/srv
      # Port for FileBrowser to listen on (non-privileged port, doesn't require root)
      - FB_PORT=3000
      # Set default admin credentials (only used on first startup)
      # If database already exists, these are ignored
      - FB_DEFAULT_USER=admin
      - FB_DEFAULT_PASS=admin
      # Optional: Set timezone
      - TZ=Asia/Kolkata
    networks:
      - filebrowser-network
    # Enable interactive terminal access
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  filebrowser-network:
    driver: bridge

