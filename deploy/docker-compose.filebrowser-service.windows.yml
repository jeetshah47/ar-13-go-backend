services:
  filebrowser-service:
    build:
      context: ./services/filebrowser
      dockerfile: Dockerfile
    container_name: filebrowser-service
    restart: unless-stopped
    # Run as non-root user (UID 1000, GID 1000)
    user: "1000:1000"
    ports:
      # Map host port 8082 to container port 8082
      - "8082:8082"
    volumes:
      # Mount Windows folder containing client files
      # All files in this folder will be visible in the file browser
      - "D:/Resumers/:/data"
    environment:
      # Root directory for file browser (matches volume mount)
      - DATA_ROOT=/data
      # Port for the service to listen on
      - PORT=8082
      # Optional: Set timezone
      - TZ=Asia/Kolkata
    networks:
      - filebrowser-network
    # Enable interactive terminal access
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  filebrowser-network:
    driver: bridge

