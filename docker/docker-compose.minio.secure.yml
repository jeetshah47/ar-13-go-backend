version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      # Load credentials from .env file (create this file with your credentials)
      - .env.minio
    environment:
      # Optional: Set timezone
      TZ: Asia/Kolkata
    ports:
      # MinIO API (for S3 operations)
      - "32774:9000"
      # MinIO Console (Web UI)
      - "32775:9001"
    volumes:
      # Persistent storage for MinIO data
      - /share/Container/minio/data:/data
      # Optional: MinIO configuration
      - /share/Container/minio/config:/root/.minio
    networks:
      - minio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

networks:
  minio-network:
    driver: bridge

