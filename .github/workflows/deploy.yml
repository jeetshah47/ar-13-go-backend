name: NAS Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for .env file
        working-directory: docker
        run: |
          if [ ! -f .env ]; then
            echo "❌ ERROR: .env file not found in docker/ directory"
            echo ""
            echo "Please create a .env file with your environment variables."
            echo "You can:"
            echo "  1. Copy env.template to .env: cp docker/env.template docker/.env"
            echo "  2. Edit .env and fill in your actual values"
            echo "  3. See docker/ENV_SETUP.md for detailed instructions"
            exit 1
          fi
          echo "✅ .env file found"

      - name: Stop existing containers
        working-directory: docker
        run: |
          docker compose -f docker-compose.nas.yml down || true

      - name: Build and start containers
        working-directory: docker
        run: |
          docker compose -f docker-compose.nas.yml build --no-cache
          docker compose -f docker-compose.nas.yml up -d

      - name: Verify deployment
        working-directory: docker
        run: |
          sleep 10
          docker compose -f docker-compose.nas.yml ps
          docker compose -f docker-compose.nas.yml logs --tail=50 server

      - name: Clean up old images
        run: |
          docker image prune -f
